services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: skku_lost_and_found
      POSTGRES_USER: skku
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skku -d skku_lost_and_found"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://skku:local-dev-only@db:5432/skku_lost_and_found
      JWT_SECRET_KEY: local-dev-secret-only-not-for-production
      EMAIL_DELIVERY_MODE: console
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/tests:/app/tests
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
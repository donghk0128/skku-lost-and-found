name: skku-analytics
services:
  metadata:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: local-airflow-only
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10
    volumes:
      - airflow_metadata:/var/lib/postgresql/data
  airflow-init:
    build: .
    env_file: .env
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:local-airflow-only@metadata/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      PYTHONPATH: /opt/airflow
    command: airflow db migrate
    depends_on:
      metadata:
        condition: service_healthy
    volumes: &airflow_volumes
      - ./dags:/opt/airflow/dags:ro
      - ./pipeline:/opt/airflow/pipeline:ro
      - ./logs:/opt/airflow/logs
      - type: bind
        source: ./secrets/gcp-sa.json
        target: /run/secrets/gcp-sa.json
        read_only: true
        bind:
          create_host_path: false
  airflow-api-server:
    build: .
    env_file: .env
    environment: *airflow_env
    command: airflow api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes: *airflow_volumes
  airflow-scheduler:
    build: .
    env_file: .env
    environment: *airflow_env
    command: airflow scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes: *airflow_volumes
  airflow-dag-processor:
    build: .
    env_file: .env
    environment: *airflow_env
    command: airflow dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes: *airflow_volumes
volumes:
  airflow_metadata:
